# Спільний запуск проєкту C30 «Диспетчерська допомоги» (Web + DPC), ЛР1–ЛР2.
#   cp .env.example .env && docker compose up -d --build
# Одна база PostgreSQL для обох частин (розділ 6 картки DPC): міграції в ./migrations.
# Сервіси пізніших ЛР (Kafka, шлюзи, Ray, Spark, etcd) підключаються з web/compose.yaml і
# dpc/compose.yaml комплектів, коли до них дійде робота.

x-web: &web
  build: ./web/server
  image: c30-web:${APP_TAG:-dev}
  environment: &web-env
    DATABASE_URL: postgresql://app:app@postgres:5432/app
    CLIENT_ORIGIN: ${WEB_CLIENT_ORIGIN:-http://localhost:8081}
    POOL_SIZE: ${POOL_SIZE:-10}
    FAULTS: "on"
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - faults:/faults

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-100}"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30

  migrate:
    image: postgres:17.11
    command: ["sh", "-c", "sh /migrate/migrate.sh $${MIGRATE_TO:+--to $$MIGRATE_TO}"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      MIGRATIONS_DIR: /migrations
      MIGRATE_TO: ${MIGRATE_TO:-}
    volumes:
      - ./web/configs/migrate:/migrate:ro
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------- частина Web ----------
  app-a:
    <<: *web
    environment:
      <<: *web-env
      INSTANCE: app-a
    ports:
      - "${APP_A_PORT:-8001}:8000"
  app-b:
    <<: *web
    environment:
      <<: *web-env
      INSTANCE: app-b
    ports:
      - "${APP_B_PORT:-8002}:8000"
  nginx:
    image: nginx:1.31.7
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app-a
      - app-b
    restart: unless-stopped

  # ---------- частина DPC ----------
  dpc-api:
    build: ./dpc/api
    image: c30-dpc-api:${APP_TAG:-dev}
    environment:
      INSTANCE: dpc-api
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      API_TOKEN: ${API_TOKEN:-dev-token}
      CLIENT_ORIGIN: ${DPC_CLIENT_ORIGIN:-http://localhost:8083}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-50}
      WORKERS: ${WORKERS:-4}
      RESOURCE_MODE: ${RESOURCE_MODE:-locked}
      COMPUTE_PROCESSES: ${COMPUTE_PROCESSES:-4}
      FAULTS: "on"
    ports:
      - "${API_PORT:-8000}:8000"
    cpus: ${DPC_CPUS:-4}
    stop_grace_period: 120s
    volumes:
      - faults:/faults
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  faults:
