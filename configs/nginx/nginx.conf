# Балансувальник частини Web (ЛР1–ЛР2): :8080 -> nginx :80 -> app-a, app-b (least_conn).
# Шлюзи WebSocket і канарковий екземпляр додаються в ЛР5–ЛР6 (див. web/configs/nginx/nginx.conf).
events { worker_connections 4096; }

http {
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id","upstream":"$upstream_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,"rt":$request_time}';
  access_log /dev/stdout json;

  upstream app {
    least_conn;
    server app-a:8000 max_fails=1 fail_timeout=2s;
    server app-b:8000 max_fails=1 fail_timeout=2s;
  }

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  server {
    listen 80;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $req_id;
      proxy_next_upstream error timeout;   # лише помилки з'єднання; POST не повторюється після відповіді
    }
  }
}
