# Контракт частини DPC теми C30 «Диспетчерська допомоги» (OpenAPI 3.1).
# x-course для засобу check: receiver, request-state, resource-state.
# "{uuid}" у прикладі стає новим ідентифікатором у кожному запиті.
openapi: 3.1.0
info:
  title: Диспетчерська допомоги — DPC (гаряча лінія)
  version: 1.0.0
  description: |
    Сервіс `api` приймає дзвінки гарячої лінії в обмежену чергу; пул обробників виконує
    повільний виклик «зв'язок із командою» (200–900 мс) і призначає вільну команду району.
    Ресурс — команди району (district_teams), інваріант — команда виконує одну заявку.
    Маршрути `/v1` потребують `Authorization: Bearer <API_TOKEN>`.
    Помилки — Problem Details (RFC 9457, `application/problem+json`).
servers:
  - url: http://localhost:8000
security:
  - apiToken: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Перевірка працездатності процесу; швидка відповідь навіть під навантаженням
      security: []
      responses:
        "200":
          description: Процес відповідає
  /metrics:
    get:
      operationId: getMetrics
      summary: Метрики черги й часу виконання
      description: |
        `latency_ms` — час HTTP-відповіді маршрутів /v1 (останні 2000 запитів).
        `full_ms_p50/p95/p99` — повний час оброблення запиту області: від надходження
        до завершення оброблення (останні 2000 завершених запитів). Це різні інтервали.
      security: []
      responses:
        "200":
          description: Метрики
          content:
            application/json:
              schema:
                type: object
                properties:
                  latency_ms:
                    type: object
                  in_flight:
                    type: integer
                  queue_length:
                    type: integer
                  queue_capacity:
                    type: integer
                  workers:
                    type: integer
                  processing:
                    type: integer
                    description: Запитів в обробленні
                  rejected:
                    type: integer
                    description: Відхилено через повну чергу (429)
                  rejected_by_rule:
                    type: integer
                    description: Відхилено за предметним правилом (немає вільної команди)
                  full_ms_p50:
                    type: [number, "null"]
                  full_ms_p95:
                    type: [number, "null"]
                  full_ms_p99:
                    type: [number, "null"]
                  responses:
                    type: object
                    additionalProperties:
                      type: integer

  /v1/assignment-requests:
    post:
      operationId: createAssignmentRequest
      summary: Прийняти дзвінок гарячої лінії в обмежену чергу (202 до завершення оброблення)
      x-course: receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentCreate"
            examples:
              normal:
                value:
                  request_id: "hl-{uuid}"   # {uuid} підставляє засіб check
                  district: center
                  kind: medicine
      responses:
        "202":
          description: Прийнято в чергу
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestState"
              example:
                id: hl-001
                state: queued
                reason: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/assignment-requests/{id}:
    get:
      operationId: getAssignmentRequest
      summary: Стан запиту (queued → processing → done | rejected | failed) і час виконання
      x-course: request-state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Стан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestState"
              example:
                id: hl-001
                state: done
                reason: null
                team_id: center-t007
                district: center
                timings_ms:
                  queue_wait: 3.8
                  processing: 740.2
                  delivery_wait: 473.1
                  total: 1217.1
                timings_ordered: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/district-teams/{id}:
    get:
      operationId: getDistrictTeams
      summary: Стан ресурсу — команди району; інваріант «команда виконує одну заявку»
      x-course: resource-state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: center
      responses:
        "200":
          description: Стан ресурсу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictTeams"
              example:
                district: test-race
                teams_total: 3
                busy: 3
                active_assignments: 3
                teams_with_several_requests: []
                invariant_ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    AssignmentCreate:
      type: object
      additionalProperties: false
      required: [request_id, district, kind]
      properties:
        request_id:
          type: string
          pattern: "^[A-Za-z0-9._:-]+$"
          maxLength: 64
          description: Спільний ідентифікатор заявки (розділ 6 картки)
        district:
          type: string
        kind:
          type: string
          enum: [medicine, escort, food, other]
        address:
          type: string
          minLength: 3
          maxLength: 300
    RequestState:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [queued, processing, done, rejected, failed]
        reason:
          type: [string, "null"]
          description: rejected — предметне правило (немає вільної команди), failed — помилка оброблення
        team_id:
          type: [string, "null"]
        district:
          type: string
        timings_ms:
          type: [object, "null"]
          description: Інтервали монотонного годинника (мс)
          properties:
            queue_wait:
              type: [number, "null"]
            processing:
              type: [number, "null"]
            delivery_wait:
              type: [number, "null"]
            total:
              type: [number, "null"]
        timings_ordered:
          type: [boolean, "null"]
    DistrictTeams:
      type: object
      required: [district, teams_total, busy, active_assignments, invariant_ok]
      properties:
        district:
          type: string
        teams_total:
          type: integer
        busy:
          type: integer
        active_assignments:
          type: integer
        teams_with_several_requests:
          type: array
          items:
            type: string
        invariant_ok:
          type: boolean
  responses:
    BadRequest:
      description: Некоректний запит
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Потрібен токен API
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Не знайдено
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Запит із таким request_id уже прийнято
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Неправильні дані
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Черга заповнена; запит не прийнято
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
